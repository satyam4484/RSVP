rsvp:
  scheduling:
    enabled: false
  jwt:
    secret: test-jwt-secret-must-be-at-least-32-chars
    access-token-minutes: 15
    refresh-token-days: 14
  encryption:
    key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  public-base-url: http://localhost:8080
  storage:
    local-dir: ./target/test-uploads
  google:
    client-id: test-google-client
    client-secret: test-google-secret
    redirect-uri: http://localhost:8080/api/v1/integrations/google/callback

logging:
  level:
    com.rsvp: INFO
    org.springframework: WARN
