spring:
  application:
    name: rsvp
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_uuid_jdbc_type: CHAR
      hibernate.default_batch_fetch_size: 25
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: RSVP
    description: Event and personal event management API

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true

rsvp:
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  cors-allowed-origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080
  jwt:
    secret: ${JWT_SECRET:dev-only-rsvp-jwt-secret-change-me-32}
    access-token-minutes: ${JWT_ACCESS_MINUTES:15}
    refresh-token-days: ${JWT_REFRESH_DAYS:14}
    issuer: rsvp
  encryption:
    key: ${ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  storage:
    local-dir: ${STORAGE_DIR:./data/uploads}
    max-bytes: 20971520
  rate-limit:
    login-attempts: 5
    window-seconds: 60
  scheduling:
    enabled: true
    event-completion-delay-ms: 600000
    reminder-delay-ms: 60000
    calendar-retry-delay-ms: 600000
    token-refresh-delay-ms: 900000
    cleanup-delay-ms: 86400000
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:${PUBLIC_BASE_URL:http://localhost:8080}/api/v1/integrations/google/callback}
  apple:
    client-id: ${APPLE_CLIENT_ID:}
    client-secret: ${APPLE_CLIENT_SECRET:}

logging:
  level:
    com.rsvp: INFO
    org.springframework.security: INFO
