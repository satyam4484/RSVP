spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false

rsvp:
  jwt:
    secret: ${JWT_SECRET}
  encryption:
    key: ${ENCRYPTION_KEY}
  public-base-url: ${PUBLIC_BASE_URL}

logging:
  level:
    com.rsvp: INFO
    org.springframework.security: WARN
